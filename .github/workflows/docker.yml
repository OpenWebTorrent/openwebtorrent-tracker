name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/openwebtorrent/openwebtorrent-tracker

jobs:
  test:
    name: Build and test image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies
        run: make deps

      - name: Build image
        run: docker build -t owt:test .

      - name: Start container
        run: |
          docker run -d --name owt -p 8000:8000 owt:test
          for i in $(seq 1 50); do
            docker logs owt 2>&1 | grep -q Listening && break
            sleep 0.2
          done
          docker logs owt

      - name: Runs as non-root
        run: test "$(docker exec owt id -u)" != 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test
        working-directory: tests/node
        run: |
          npm install
          node smoke.js ws://127.0.0.1:8000

      # Without an init process as PID 1, SIGTERM is ignored and docker stop
      # waits 10 seconds before killing the container
      - name: Stops promptly on SIGTERM
        run: |
          start=$(date +%s)
          docker stop owt
          elapsed=$(( $(date +%s) - start ))
          echo "Stopped in ${elapsed} s"
          test "$elapsed" -lt 5

      - name: Container logs
        if: failure()
        run: docker logs owt || true

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies
        run: make deps

      # arm64 is built under emulation: slow, but only on master and tags
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # master -> :master and :latest, v1.2.3 -> :1.2.3 and :1.2, plus :sha-<commit>
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
